<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif">
  <defs>
    <linearGradient id="gr-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e4a8"/><stop offset=".45" stop-color="#d4af37"/><stop offset="1" stop-color="#7a5f1e"/>
    </linearGradient>
    <linearGradient id="gr-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a5a30"/><stop offset=".5" stop-color="#c9a860"/><stop offset="1" stop-color="#4a3a1c"/>
    </linearGradient>
    <linearGradient id="gr-parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece2c6"/><stop offset="1" stop-color="#cbbc94"/>
    </linearGradient>
    <radialGradient id="gr-art" cx=".5" cy=".55" r=".9">
      <stop offset="0" stop-color="#33401a"/><stop offset=".55" stop-color="#1a240c"/><stop offset="1" stop-color="#070c03"/>
    </radialGradient>
    <linearGradient id="gr-arrow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6a8a20"/><stop offset="1" stop-color="#e8ff90"/>
    </linearGradient>
    <linearGradient id="gr-knight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6a34"/><stop offset="1" stop-color="#242e10"/>
    </linearGradient>
    <filter id="gr-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" result="n" seed="12"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .5 0 0 0 0 .58 0 0 0 0 .3 0 0 0 .14 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="gr-mist" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".02 .045" numOctaves="3" seed="6" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="20"/>
    </filter>
    <clipPath id="gr-clip"><rect x="24" y="70" width="252" height="188" rx="6"/></clipPath>
  </defs>

  <rect x="3" y="3" width="294" height="414" rx="14" fill="#0a0810"/>
  <rect x="3" y="3" width="294" height="414" rx="14" filter="url(#gr-noise)"/>
  <rect x="7.5" y="7.5" width="285" height="405" rx="11" fill="none" stroke="url(#gr-frame)" stroke-width="3"/>
  <rect x="13" y="13" width="274" height="394" rx="8" fill="none" stroke="#c9a227" stroke-opacity=".4"/>
  <g stroke="url(#gr-gold)" stroke-width="2" fill="none">
    <path d="M13 34 Q13 13 34 13"/><path d="M266 13 Q287 13 287 34"/>
    <path d="M287 386 Q287 407 266 407"/><path d="M34 407 Q13 407 13 386"/>
  </g>
  <g fill="#d4af37"><circle cx="21" cy="21" r="2.2"/><circle cx="279" cy="21" r="2.2"/><circle cx="279" cy="399" r="2.2"/><circle cx="21" cy="399" r="2.2"/></g>

  <circle cx="38" cy="40" r="17" fill="#1a240c" stroke="url(#gr-gold)" stroke-width="2.5"/>
  <path d="M38 50 V32 M32 38 L38 30 L44 38" stroke="#c8e858" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="163" y="40" text-anchor="middle" font-size="25" fill="#efe6cf" font-family="Georgia,'Times New Roman',serif" letter-spacing="2">growth</text>
  <text x="163" y="59" text-anchor="middle" font-size="13" letter-spacing="6" fill="#c9b87a">成長</text>

  <rect x="24" y="70" width="252" height="188" rx="6" fill="url(#gr-art)"/>
  <g clip-path="url(#gr-clip)">
    <ellipse cx="150" cy="240" rx="130" ry="60" fill="#0c1405" opacity=".9"/>
    <g filter="url(#gr-mist)">
      <path d="M150 96 C120 118 116 168 122 244 L178 244 C184 168 180 118 150 96 Z" fill="url(#gr-knight)"/>
      <path d="M150 96 C136 106 128 124 126 148 L174 148 C172 124 164 106 150 96 Z" fill="#4a5a28"/>
      <rect x="139" y="118" width="22" height="9" rx="4" fill="#141c08"/>
    </g>
    <circle cx="144" cy="123" r="2" fill="#e8ff90"/><circle cx="156" cy="123" r="2" fill="#e8ff90"/>
    <g stroke="url(#gr-arrow)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
      <path d="M84 226 V150 M70 166 L84 148 L98 166"/>
      <path d="M150 210 V96 M133 116 L150 92 L167 116" stroke-width="11"/>
      <path d="M216 226 V150 M202 166 L216 148 L230 166"/>
    </g>
    <g stroke="#e8ff90" stroke-width="2" fill="none" opacity=".8" stroke-linecap="round">
      <path d="M84 226 V152"/><path d="M150 208 V100"/><path d="M216 226 V152"/>
    </g>
    <g fill="#e8ff90">
      <circle cx="104" cy="120" r="1.8" opacity=".8"><animate attributeName="cy" values="120;104;120" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="196" cy="112" r="1.5" opacity=".7"><animate attributeName="cy" values="112;96;112" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="66" cy="180" r="1.6" opacity=".7"/><circle cx="236" cy="188" r="1.8" opacity=".6"/>
      <circle cx="128" cy="86" r="1.4" opacity=".8"/><circle cx="174" cy="80" r="1.2" opacity=".7"/>
    </g>
    <g stroke="#7a9a30" stroke-width="1.6" fill="none" opacity=".7" stroke-linecap="round">
      <path d="M52 244 q4 -18 -6 -28 M60 244 q8 -14 2 -30"/>
      <path d="M248 244 q-4 -18 6 -28 M240 244 q-8 -14 -2 -30"/>
    </g>
    <ellipse cx="150" cy="254" rx="130" ry="14" fill="#040802" opacity=".95"/>
  </g>
  <rect x="24" y="70" width="252" height="188" rx="6" fill="none" stroke="url(#gr-frame)" stroke-width="1.5"/>

  <rect x="26" y="286" width="248" height="92" rx="5" fill="url(#gr-parch)" stroke="#4a3a20" stroke-width="1.5"/>
  <rect x="29" y="289" width="242" height="86" rx="3" fill="none" stroke="#8a744a" stroke-opacity=".5"/>
  <text x="150" y="305" text-anchor="middle" font-size="10" letter-spacing="3" fill="#7a6640">─ スペルカード ─</text>
  <text x="150" y="325" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#241c10">戦場のストライカー1人の</text>
  <text x="150" y="344" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#241c10">エネルギーを1上げる</text>
  <text x="150" y="366" text-anchor="middle" font-size="10.5" fill="#6a5c40">「力は静かに満ちてゆく」</text>

  <circle cx="150" cy="394" r="13" fill="#1a240c" stroke="url(#gr-gold)" stroke-width="2"/>
  <path d="M150 400 V390 M145.5 394 L150 388.5 L154.5 394" stroke="#c8e858" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
