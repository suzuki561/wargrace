<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif">
  <defs>
    <linearGradient id="hr-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e4a8"/><stop offset=".45" stop-color="#d4af37"/><stop offset="1" stop-color="#7a5f1e"/>
    </linearGradient>
    <linearGradient id="hr-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a5a30"/><stop offset=".5" stop-color="#c9a860"/><stop offset="1" stop-color="#4a3a1c"/>
    </linearGradient>
    <linearGradient id="hr-parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece2c6"/><stop offset="1" stop-color="#cbbc94"/>
    </linearGradient>
    <radialGradient id="hr-art" cx=".5" cy=".35" r=".95">
      <stop offset="0" stop-color="#2a3d5c"/><stop offset=".55" stop-color="#152238"/><stop offset="1" stop-color="#060a14"/>
    </radialGradient>
    <linearGradient id="hr-armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cb0c8"/><stop offset=".5" stop-color="#5c7290"/><stop offset="1" stop-color="#2e3c52"/>
    </linearGradient>
    <linearGradient id="hr-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f6ff"/><stop offset=".5" stop-color="#b8c8dc"/><stop offset="1" stop-color="#78889c"/>
    </linearGradient>
    <filter id="hr-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" result="n" seed="14"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .4 0 0 0 0 .48 0 0 0 0 .6 0 0 0 .15 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="hr-cloud" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".015 .04" numOctaves="3" seed="2" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="26"/>
    </filter>
    <clipPath id="hr-clip"><rect x="24" y="70" width="252" height="188" rx="6"/></clipPath>
  </defs>

  <rect x="3" y="3" width="294" height="414" rx="14" fill="#0a0810"/>
  <rect x="3" y="3" width="294" height="414" rx="14" filter="url(#hr-noise)"/>
  <rect x="7.5" y="7.5" width="285" height="405" rx="11" fill="none" stroke="url(#hr-frame)" stroke-width="3"/>
  <rect x="13" y="13" width="274" height="394" rx="8" fill="none" stroke="#c9a227" stroke-opacity=".4"/>
  <g stroke="url(#hr-gold)" stroke-width="2" fill="none">
    <path d="M13 34 Q13 13 34 13"/><path d="M266 13 Q287 13 287 34"/>
    <path d="M287 386 Q287 407 266 407"/><path d="M34 407 Q13 407 13 386"/>
  </g>
  <g fill="#d4af37"><circle cx="21" cy="21" r="2.2"/><circle cx="279" cy="21" r="2.2"/><circle cx="279" cy="399" r="2.2"/><circle cx="21" cy="399" r="2.2"/></g>

  <circle cx="38" cy="40" r="17" fill="#152238" stroke="url(#hr-gold)" stroke-width="2.5"/>
  <text x="38" y="49" text-anchor="middle" font-size="26" font-weight="bold" fill="#9fd0ff" font-family="Georgia,serif">2</text>

  <text x="163" y="40" text-anchor="middle" font-size="25" fill="#efe6cf" font-family="Georgia,'Times New Roman',serif" letter-spacing="2">hero</text>
  <text x="163" y="59" text-anchor="middle" font-size="13" letter-spacing="6" fill="#c9b87a">英雄</text>

  <rect x="24" y="70" width="252" height="188" rx="6" fill="url(#hr-art)"/>
  <g clip-path="url(#hr-clip)">
    <g filter="url(#hr-cloud)" opacity=".7">
      <ellipse cx="70" cy="100" rx="70" ry="30" fill="#0c1626"/>
      <ellipse cx="235" cy="92" rx="70" ry="28" fill="#101c30"/>
    </g>
    <circle cx="150" cy="128" r="64" fill="#e8f0ff" opacity=".08"/>
    <path d="M190 244 L190 96 L196 84 L202 96 L202 244" fill="url(#hr-blade)"/>
    <path d="M196 88 L196 240" stroke="#ffffff" stroke-width="1.4" opacity=".8"/>
    <rect x="178" y="196" width="36" height="9" rx="4" fill="url(#hr-gold)"/>
    <rect x="191" y="205" width="10" height="26" rx="4" fill="#3a2c14"/>
    <circle cx="196" cy="236" r="6" fill="url(#hr-gold)"/>
    <path d="M118 258 C114 212 122 186 138 174 L136 152 C134 136 140 122 152 116 C166 122 172 136 168 152 L164 176 C178 190 184 214 182 258 Z" fill="url(#hr-armor)"/>
    <path d="M122 186 C112 192 106 204 104 220 M182 184 C192 192 197 204 198 218" stroke="#54667e" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M152 116 C144 122 140 132 141 144 L163 144 C164 132 160 122 152 116 Z" fill="#c8d8ec"/>
    <path d="M141 138 h22" stroke="#2e3c52" stroke-width="3"/>
    <path d="M147 132 h4 M155 132 h4" stroke="#1a2436" stroke-width="2"/>
    <path d="M152 112 C146 106 146 98 152 92 C160 96 162 106 158 112 Z" fill="#e0c060"/>
    <path d="M138 166 Q150 172 166 166 L164 178 Q150 184 140 178 Z" fill="#ffd868" opacity=".85"/>
    <g fill="#cfe0ff">
      <circle cx="86" cy="140" r="1.6" opacity=".7"/><circle cx="228" cy="128" r="1.4" opacity=".6"/>
      <circle cx="74" cy="196" r="1.3" opacity=".5"/><circle cx="244" cy="180" r="1.5" opacity=".6"/>
    </g>
    <ellipse cx="150" cy="254" rx="130" ry="16" fill="#02050c" opacity=".92"/>
  </g>
  <rect x="24" y="70" width="252" height="188" rx="6" fill="none" stroke="url(#hr-frame)" stroke-width="1.5"/>

  <rect x="26" y="286" width="248" height="92" rx="5" fill="url(#hr-parch)" stroke="#4a3a20" stroke-width="1.5"/>
  <rect x="29" y="289" width="242" height="86" rx="3" fill="none" stroke="#8a744a" stroke-opacity=".5"/>
  <text x="150" y="305" text-anchor="middle" font-size="10" letter-spacing="3" fill="#7a6640">─ ストライカー ・ エネルギー 2 ─</text>
  <text x="150" y="325" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#241c10">戦場から離れた時、</text>
  <text x="150" y="344" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#241c10">護衛を1人増やす</text>
  <text x="150" y="366" text-anchor="middle" font-size="10.5" fill="#6a5c40">「その剣は民の希望のために」</text>

  <circle cx="150" cy="394" r="13" fill="#152238" stroke="url(#hr-gold)" stroke-width="2"/>
  <path d="M150 386 L150 398 M146 390 L154 390 M147 400 L153 400 M150 398 L150 401" stroke="#9fd0ff" stroke-width="2" stroke-linecap="round"/>
</svg>
