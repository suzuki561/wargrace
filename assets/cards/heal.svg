<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif">
  <defs>
    <linearGradient id="he-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e4a8"/><stop offset=".45" stop-color="#d4af37"/><stop offset="1" stop-color="#7a5f1e"/>
    </linearGradient>
    <linearGradient id="he-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a5a30"/><stop offset=".5" stop-color="#c9a860"/><stop offset="1" stop-color="#4a3a1c"/>
    </linearGradient>
    <linearGradient id="he-parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece2c6"/><stop offset="1" stop-color="#cbbc94"/>
    </linearGradient>
    <radialGradient id="he-art" cx=".5" cy=".38" r=".9">
      <stop offset="0" stop-color="#2c3d1e"/><stop offset=".55" stop-color="#14200e"/><stop offset="1" stop-color="#050a04"/>
    </radialGradient>
    <radialGradient id="he-light" cx=".5" cy=".32" r=".55">
      <stop offset="0" stop-color="#f8ffd8" stop-opacity=".95"/><stop offset=".4" stop-color="#b8e880" stop-opacity=".5"/><stop offset="1" stop-color="#b8e880" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="he-hand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff0c0"/><stop offset="1" stop-color="#5a7a3a"/>
    </linearGradient>
    <filter id="he-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" result="n" seed="9"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .42 0 0 0 0 .55 0 0 0 0 .35 0 0 0 .14 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="he-mist" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .04" numOctaves="3" seed="5" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="26"/>
    </filter>
    <clipPath id="he-clip"><rect x="24" y="70" width="252" height="188" rx="6"/></clipPath>
  </defs>

  <rect x="3" y="3" width="294" height="414" rx="14" fill="#0a0810"/>
  <rect x="3" y="3" width="294" height="414" rx="14" filter="url(#he-noise)"/>
  <rect x="7.5" y="7.5" width="285" height="405" rx="11" fill="none" stroke="url(#he-frame)" stroke-width="3"/>
  <rect x="13" y="13" width="274" height="394" rx="8" fill="none" stroke="#c9a227" stroke-opacity=".4"/>
  <g stroke="url(#he-gold)" stroke-width="2" fill="none">
    <path d="M13 34 Q13 13 34 13"/><path d="M266 13 Q287 13 287 34"/>
    <path d="M287 386 Q287 407 266 407"/><path d="M34 407 Q13 407 13 386"/>
  </g>
  <g fill="#d4af37"><circle cx="21" cy="21" r="2.2"/><circle cx="279" cy="21" r="2.2"/><circle cx="279" cy="399" r="2.2"/><circle cx="21" cy="399" r="2.2"/></g>

  <circle cx="38" cy="40" r="17" fill="#14200e" stroke="url(#he-gold)" stroke-width="2.5"/>
  <path d="M38 30 v20 M28 40 h20" stroke="#a8e070" stroke-width="4.5" stroke-linecap="round"/>

  <text x="163" y="40" text-anchor="middle" font-size="25" fill="#efe6cf" font-family="Georgia,'Times New Roman',serif" letter-spacing="2">heal</text>
  <text x="163" y="59" text-anchor="middle" font-size="13" letter-spacing="6" fill="#c9b87a">治癒</text>

  <rect x="24" y="70" width="252" height="188" rx="6" fill="url(#he-art)"/>
  <g clip-path="url(#he-clip)">
    <ellipse cx="150" cy="130" rx="130" ry="100" fill="url(#he-light)"/>
    <g stroke="#e8ffb8" stroke-width="2.5" opacity=".55" stroke-linecap="round">
      <path d="M150 74 L150 130"/><path d="M118 80 L134 128"/><path d="M182 80 L166 128"/>
      <path d="M92 96 L122 136"/><path d="M208 96 L178 136"/>
    </g>
    <g filter="url(#he-mist)">
      <path d="M108 226 C104 190 116 170 130 158 C138 150 136 140 132 132 L146 144 C150 132 148 120 144 110 L158 128 C164 118 164 106 162 98 L170 122 C178 132 180 148 176 160 C190 172 198 192 194 226 Z" fill="url(#he-hand)" opacity=".9"/>
    </g>
    <g fill="#f8ffd8">
      <circle cx="110" cy="120" r="2.2" opacity=".9"><animate attributeName="cy" values="120;104;120" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="196" cy="140" r="1.8" opacity=".8"><animate attributeName="cy" values="140;122;140" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="82" cy="180" r="1.6" opacity=".7"/><circle cx="224" cy="172" r="2" opacity=".75"/>
      <circle cx="132" cy="94" r="1.5" opacity=".8"/><circle cx="176" cy="86" r="1.3" opacity=".7"/>
    </g>
    <g stroke="#a8e070" stroke-width="1.4" fill="none" opacity=".6" stroke-linecap="round">
      <path d="M64 210 q10 -18 2 -34"/><path d="M72 214 q14 -14 10 -30"/>
      <path d="M236 206 q-10 -18 -2 -34"/><path d="M228 212 q-14 -14 -10 -30"/>
    </g>
    <ellipse cx="150" cy="250" rx="120" ry="16" fill="#020803" opacity=".9"/>
    <ellipse cx="150" cy="238" rx="70" ry="8" fill="#3a5a22" opacity=".5" filter="url(#he-mist)"/>
  </g>
  <rect x="24" y="70" width="252" height="188" rx="6" fill="none" stroke="url(#he-frame)" stroke-width="1.5"/>

  <rect x="26" y="286" width="248" height="92" rx="5" fill="url(#he-parch)" stroke="#4a3a20" stroke-width="1.5"/>
  <rect x="29" y="289" width="242" height="86" rx="3" fill="none" stroke="#8a744a" stroke-opacity=".5"/>
  <text x="150" y="305" text-anchor="middle" font-size="10" letter-spacing="3" fill="#7a6640">─ スペルカード ─</text>
  <text x="150" y="331" text-anchor="middle" font-size="16" font-weight="bold" fill="#241c10">護衛を3体復活させる</text>
  <text x="150" y="364" text-anchor="middle" font-size="10.5" fill="#6a5c40">「光は倒れし者を再び立たせる」</text>

  <circle cx="150" cy="394" r="13" fill="#14200e" stroke="url(#he-gold)" stroke-width="2"/>
  <path d="M150 387 v14 M143 394 h14" stroke="#a8e070" stroke-width="3.4" stroke-linecap="round"/>
</svg>
