      <path d="M150 100 C114 100 92 128 92 162 C92 196 112 222 128 236 L128 258 L172 258 L172 236 C188 222 208 196 208 162 C208 128 186 100 150 100 Z" fill="url(#mo-body)"/>
    </g>
    <path d="M112 118 C100 104 94 88 96 74 C110 80 120 92 124 106 Z" fill="url(#mo-horn)"/>
    <path d="M188 118 C200 104 206 88 204 74 C190 80 180 92 176 106 Z" fill="url(#mo-horn)"/>
    <path d="M118 150 C124 144 134 144 140 150 C136 158 122 158 118 150 Z" fill="#ffb02e"/>
    <path d="M182 150 C176 144 166 144 160 150 C164 158 178 158 182 150 Z" fill="#ffb02e"/>
    <circle cx="129" cy="151" r="2.6" fill="#3a0c04"/><circle cx="171" cy="151" r="2.6" fill="#3a0c04"/>
    <path d="M122 190 C132 184 168 184 178 190 C172 200 164 204 150 204 C136 204 128 200 122 190 Z" fill="#1c0503"/>
    <path d="M128 190 l5 8 5 -8 5 8 5 -8 4 8 4 -8 5 8 5 -8 5 8 5 -8" stroke="#e8dcc0" stroke-width="2.4" fill="none"/>
    <path d="M96 168 C88 172 82 180 80 190 M204 168 C212 172 218 180 220 190" stroke="#4a1810" stroke-width="7" fill="none" stroke-linecap="round"/>
    <g fill="#ff9a4a">
      <circle cx="76" cy="140" r="1.8" opacity=".8"><animate attributeName="cy" values="140;124;140" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="228" cy="132" r="1.5" opacity=".7"><animate attributeName="cy" values="132;114;132" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="200" r="1.6" opacity=".7"/><circle cx="242" cy="206" r="1.7" opacity=".65"/>
      <circle cx="106" cy="86" r="1.3" opacity=".6"/><circle cx="196" cy="82" r="1.2" opacity=".6"/>
    </g>
    <ellipse cx="150" cy="256" rx="130" ry="15" fill="#050101" opacity=".9"/>
