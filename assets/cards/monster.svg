  <rect x="24" y="70" width="252" height="188" rx="6" fill="none" stroke="url(#mo-frame)" stroke-width="1.5"/>

  <rect x="26" y="286" width="248" height="92" rx="5" fill="url(#mo-parch)" stroke="#4a3a20" stroke-width="1.5"/>
  <rect x="29" y="289" width="242" height="86" rx="3" fill="none" stroke="#8a744a" stroke-opacity=".5"/>
  <text x="150" y="305" text-anchor="middle" font-size="10" letter-spacing="3" fill="#7a6640">─ ストライカー ・ エネルギー 3 ─</text>
  <text x="150" y="325" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#241c10">毎ターン開始時に自国の</text>
  <text x="150" y="344" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#241c10">護衛を1体生贄に捧げる</text>
  <text x="150" y="366" text-anchor="middle" font-size="10.5" fill="#6a5c40">「力の代償は、味方の血」</text>

  <circle cx="150" cy="394" r="13" fill="#260a08" stroke="url(#mo-gold)" stroke-width="2"/>
  <path d="M144 390 C146 388 149 388 150 390 C151 388 154 388 156 390 C157 394 154 397 150 399 C146 397 143 394 144 390 Z" fill="#ff7a4a"/>
  <path d="M147 399 l3 2.5 3 -2.5" stroke="#ff7a4a" stroke-width="1.6" fill="none"/>
</svg>
