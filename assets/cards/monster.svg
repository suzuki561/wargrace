  <g fill="#d4af37"><circle cx="21" cy="21" r="2.2"/><circle cx="279" cy="21" r="2.2"/><circle cx="279" cy="399" r="2.2"/><circle cx="21" cy="399" r="2.2"/></g>

  <circle cx="38" cy="40" r="17" fill="#260a08" stroke="url(#mo-gold)" stroke-width="2.5"/>
  <text x="38" y="49" text-anchor="middle" font-size="26" font-weight="bold" fill="#ff9a6a" font-family="Georgia,serif">3</text>

  <text x="163" y="40" text-anchor="middle" font-size="25" fill="#efe6cf" font-family="Georgia,'Times New Roman',serif" letter-spacing="2">monster</text>
  <text x="163" y="59" text-anchor="middle" font-size="13" letter-spacing="6" fill="#c9b87a">怪物</text>

  <rect x="24" y="70" width="252" height="188" rx="6" fill="url(#mo-art)"/>
