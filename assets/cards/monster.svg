<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif">
  <defs>
    <linearGradient id="mo-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e4a8"/><stop offset=".45" stop-color="#d4af37"/><stop offset="1" stop-color="#7a5f1e"/>
    </linearGradient>
    <linearGradient id="mo-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a5a30"/><stop offset=".5" stop-color="#c9a860"/><stop offset="1" stop-color="#4a3a1c"/>
    </linearGradient>
    <linearGradient id="mo-parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece2c6"/><stop offset="1" stop-color="#cbbc94"/>
    </linearGradient>
    <radialGradient id="mo-art" cx=".5" cy=".55" r=".9">
      <stop offset="0" stop-color="#4a1410"/><stop offset=".55" stop-color="#260a08"/><stop offset="1" stop-color="#0a0303"/>
    </radialGradient>
    <radialGradient id="mo-ember" cx=".5" cy=".85" r=".7">
      <stop offset="0" stop-color="#ff7a30" stop-opacity=".7"/><stop offset=".6" stop-color="#c03a18" stop-opacity=".25"/><stop offset="1" stop-color="#c03a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mo-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2c1c"/><stop offset=".6" stop-color="#4a1810"/><stop offset="1" stop-color="#240a06"/>
    </linearGradient>
    <linearGradient id="mo-horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8a7a5c"/><stop offset="1" stop-color="#e8dcc0"/>
    </linearGradient>
    <filter id="mo-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" result="n" seed="16"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .6 0 0 0 0 .35 0 0 0 0 .28 0 0 0 .15 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="mo-flame" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".025 .055" numOctaves="3" seed="9" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="26"/>
    </filter>
    <clipPath id="mo-clip"><rect x="24" y="70" width="252" height="188" rx="6"/></clipPath>
  </defs>

  <rect x="3" y="3" width="294" height="414" rx="14" fill="#0a0810"/>
  <rect x="3" y="3" width="294" height="414" rx="14" filter="url(#mo-noise)"/>
  <rect x="7.5" y="7.5" width="285" height="405" rx="11" fill="none" stroke="url(#mo-frame)" stroke-width="3"/>
  <rect x="13" y="13" width="274" height="394" rx="8" fill="none" stroke="#c9a227" stroke-opacity=".4"/>
  <g stroke="url(#mo-gold)" stroke-width="2" fill="none">
    <path d="M13 34 Q13 13 34 13"/><path d="M266 13 Q287 13 287 34"/>
    <path d="M287 386 Q287 407 266 407"/><path d="M34 407 Q13 407 13 386"/>
