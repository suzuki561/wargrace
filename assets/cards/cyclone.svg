<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif">
  <defs>
    <linearGradient id="cy-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e4a8"/><stop offset=".45" stop-color="#d4af37"/><stop offset="1" stop-color="#7a5f1e"/>
    </linearGradient>
    <linearGradient id="cy-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a5a30"/><stop offset=".5" stop-color="#c9a860"/><stop offset="1" stop-color="#4a3a1c"/>
    </linearGradient>
    <linearGradient id="cy-parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece2c6"/><stop offset="1" stop-color="#cbbc94"/>
    </linearGradient>
    <linearGradient id="cy-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a42"/><stop offset=".6" stop-color="#0c1626"/><stop offset="1" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="cy-funnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8d4e8"/><stop offset=".5" stop-color="#6a92b0"/><stop offset="1" stop-color="#31506b"/>
    </linearGradient>
    <filter id="cy-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" result="n" seed="8"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .4 0 0 0 0 .5 0 0 0 0 .62 0 0 0 .15 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="cy-wind" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".02 .05" numOctaves="3" seed="4" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="22"/>
    </filter>
    <clipPath id="cy-clip"><rect x="24" y="70" width="252" height="188" rx="6"/></clipPath>
  </defs>

  <rect x="3" y="3" width="294" height="414" rx="14" fill="#0a0810"/>
  <rect x="3" y="3" width="294" height="414" rx="14" filter="url(#cy-noise)"/>
  <rect x="7.5" y="7.5" width="285" height="405" rx="11" fill="none" stroke="url(#cy-frame)" stroke-width="3"/>
  <rect x="13" y="13" width="274" height="394" rx="8" fill="none" stroke="#c9a227" stroke-opacity=".4"/>
  <g stroke="url(#cy-gold)" stroke-width="2" fill="none">
    <path d="M13 34 Q13 13 34 13"/><path d="M266 13 Q287 13 287 34"/>
    <path d="M287 386 Q287 407 266 407"/><path d="M34 407 Q13 407 13 386"/>
  </g>
  <g fill="#d4af37"><circle cx="21" cy="21" r="2.2"/><circle cx="279" cy="21" r="2.2"/><circle cx="279" cy="399" r="2.2"/><circle cx="21" cy="399" r="2.2"/></g>

  <circle cx="38" cy="40" r="17" fill="#0c1626" stroke="url(#cy-gold)" stroke-width="2.5"/>
  <path d="M29 33 h18 M31.5 39 h13 M34 45 h9 M36 50.5 h5" stroke="#9fd8e8" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <text x="163" y="40" text-anchor="middle" font-size="25" fill="#efe6cf" font-family="Georgia,'Times New Roman',serif" letter-spacing="2">cyclone</text>
  <text x="163" y="59" text-anchor="middle" font-size="13" letter-spacing="6" fill="#c9b87a">竜巻</text>

  <rect x="24" y="70" width="252" height="188" rx="6" fill="url(#cy-sky)"/>
  <g clip-path="url(#cy-clip)">
    <g filter="url(#cy-wind)" opacity=".85">
      <ellipse cx="80" cy="95" rx="90" ry="34" fill="#0a1420"/>
      <ellipse cx="225" cy="88" rx="85" ry="30" fill="#0e1a2c"/>
      <ellipse cx="150" cy="76" rx="130" ry="26" fill="#060d18"/>
    </g>
    <path d="M120 246 L104 96 M180 246 L196 96" stroke="#0a1420" stroke-width="3" opacity=".4"/>
    <g filter="url(#cy-wind)">
      <ellipse cx="150" cy="104" rx="86" ry="16" fill="url(#cy-funnel)" opacity=".95"/>
      <ellipse cx="150" cy="128" rx="66" ry="13" fill="url(#cy-funnel)" opacity=".88"/>
      <ellipse cx="152" cy="152" rx="48" ry="11" fill="url(#cy-funnel)" opacity=".82"/>
      <ellipse cx="148" cy="176" rx="34" ry="9" fill="url(#cy-funnel)" opacity=".78"/>
      <ellipse cx="151" cy="198" rx="22" ry="7.5" fill="url(#cy-funnel)" opacity=".74"/>
      <ellipse cx="149" cy="218" rx="13" ry="6" fill="url(#cy-funnel)" opacity=".7"/>
      <ellipse cx="150" cy="234" rx="7" ry="5" fill="url(#cy-funnel)" opacity=".68"/>
    </g>
    <path d="M196 92 L178 118 L190 118 L166 152" stroke="#ffe9a8" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/>
    <path d="M96 108 L110 128 L100 128 L116 150" stroke="#cfe6ff" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity=".6"/>
    <g stroke="#8ab4cc" stroke-width="1.6" fill="none" opacity=".7" stroke-linecap="round">
      <path d="M52 140 q26 -10 44 4"/><path d="M212 168 q22 -12 40 -2"/>
      <path d="M60 200 q30 -12 52 2"/><path d="M198 214 q26 -10 44 4"/>
    </g>
    <g fill="#cfe6ff">
      <circle cx="86" cy="164" r="1.6" opacity=".8"/><circle cx="220" cy="140" r="1.4" opacity=".7"/>
      <circle cx="102" cy="220" r="1.8" opacity=".6"/><circle cx="232" cy="196" r="1.5" opacity=".7"/>
    </g>
    <ellipse cx="150" cy="252" rx="130" ry="16" fill="#030710" opacity=".95"/>
    <ellipse cx="150" cy="244" rx="60" ry="7" fill="#1c3450" opacity=".8" filter="url(#cy-wind)"/>
  </g>
  <rect x="24" y="70" width="252" height="188" rx="6" fill="none" stroke="url(#cy-frame)" stroke-width="1.5"/>

  <rect x="26" y="286" width="248" height="92" rx="5" fill="url(#cy-parch)" stroke="#4a3a20" stroke-width="1.5"/>
  <rect x="29" y="289" width="242" height="86" rx="3" fill="none" stroke="#8a744a" stroke-opacity=".5"/>
  <text x="150" y="305" text-anchor="middle" font-size="10" letter-spacing="3" fill="#7a6640">─ スペルカード ─</text>
  <text x="150" y="331" text-anchor="middle" font-size="16" font-weight="bold" fill="#241c10">護衛を3体倒す</text>
  <text x="150" y="364" text-anchor="middle" font-size="10.5" fill="#6a5c40">「嵐は誰も選ばない」</text>

  <circle cx="150" cy="394" r="13" fill="#0c1626" stroke="url(#cy-gold)" stroke-width="2"/>
  <path d="M143 389.5 h14 M145 394 h10 M147 398.5 h6" stroke="#9fd8e8" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
