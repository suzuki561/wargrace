<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,'Times New Roman',serif">
  <defs>
    <linearGradient id="bk-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e4a8"/><stop offset=".45" stop-color="#d4af37"/><stop offset="1" stop-color="#7a5f1e"/>
    </linearGradient>
    <linearGradient id="bk-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a5a30"/><stop offset=".5" stop-color="#c9a860"/><stop offset="1" stop-color="#4a3a1c"/>
    </linearGradient>
    <radialGradient id="bk-bg" cx=".5" cy=".42" r=".95">
      <stop offset="0" stop-color="#1c2a4e"/><stop offset=".55" stop-color="#101a36"/><stop offset="1" stop-color="#060a1a"/>
    </radialGradient>
    <linearGradient id="bk-blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f0fa"/><stop offset=".6" stop-color="#9cb0c8"/><stop offset="1" stop-color="#5a6c84"/>
    </linearGradient>
    <filter id="bk-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".5" numOctaves="2" result="n" seed="20"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .35 0 0 0 0 .42 0 0 0 0 .65 0 0 0 .14 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="bk-marble" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .026" numOctaves="3" seed="21" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="30"/>
    </filter>
    <clipPath id="bk-clip"><rect x="3" y="3" width="294" height="414" rx="14"/></clipPath>
  </defs>

  <rect x="3" y="3" width="294" height="414" rx="14" fill="url(#bk-bg)"/>
  <g clip-path="url(#bk-clip)">
    <g filter="url(#bk-marble)" opacity=".5">
      <path d="M-10 90 C60 70 120 120 180 96 C230 78 270 100 320 84" stroke="#2a3c66" stroke-width="10" fill="none"/>
      <path d="M-10 240 C70 220 130 268 200 244 C250 226 290 250 320 236" stroke="#22305a" stroke-width="14" fill="none"/>
      <path d="M-10 360 C60 340 140 384 210 360 C260 342 300 366 320 352" stroke="#2a3c66" stroke-width="9" fill="none"/>
    </g>
    <rect x="3" y="3" width="294" height="414" filter="url(#bk-noise)"/>
  </g>
  <rect x="9" y="9" width="282" height="402" rx="11" fill="none" stroke="url(#bk-frame)" stroke-width="3"/>
  <rect x="15" y="15" width="270" height="390" rx="8" fill="none" stroke="#c9a227" stroke-opacity=".45"/>
  <g stroke="url(#bk-gold)" stroke-width="2" fill="none">
    <path d="M15 38 Q15 15 38 15"/><path d="M262 15 Q285 15 285 38"/>
    <path d="M285 382 Q285 405 262 405"/><path d="M38 405 Q15 405 15 382"/>
  </g>
  <g fill="#d4af37"><circle cx="23" cy="23" r="2.4"/><circle cx="277" cy="23" r="2.4"/><circle cx="277" cy="397" r="2.4"/><circle cx="23" cy="397" r="2.4"/></g>

  <circle cx="150" cy="192" r="86" fill="none" stroke="url(#bk-gold)" stroke-width="2.5" opacity=".9"/>
  <circle cx="150" cy="192" r="78" fill="none" stroke="#c9a227" stroke-opacity=".4" stroke-dasharray="4 7"/>
  <circle cx="150" cy="192" r="96" fill="none" stroke="#c9a227" stroke-opacity=".25"/>

  <g transform="translate(150 192)">
    <path d="M0 -92 L7 -78 L3.5 -70 L3.5 38 L0 46 L-3.5 38 L-3.5 -70 L-7 -78 Z" fill="url(#bk-blade)" stroke="#3a4a62" stroke-width="1"/>
    <path d="M0 -84 V40" stroke="#fff" stroke-width="1" opacity=".7"/>
    <path d="M-34 46 C-16 40 16 40 34 46 C16 54 -16 54 -34 46 Z" fill="url(#bk-gold)"/>
    <path d="M-30 46 L-42 58 M30 46 L42 58" stroke="url(#bk-gold)" stroke-width="5" stroke-linecap="round"/>
    <rect x="-4.5" y="52" width="9" height="30" rx="4" fill="#3a2c14" stroke="#c9a860" stroke-width="1"/>
    <circle cx="0" cy="90" r="8" fill="url(#bk-gold)"/>
    <circle cx="0" cy="90" r="3.4" fill="#8a1e28"/>
    <path d="M-58 -40 Q-30 -64 0 -64 Q30 -64 58 -40" stroke="#c9a227" stroke-width="1.6" fill="none" opacity=".55"/>
    <path d="M-58 -40 L-64 -50 M58 -40 L64 -50" stroke="#c9a227" stroke-width="1.6" opacity=".55"/>
    <g fill="#e8cc80">
      <circle cx="-66" cy="10" r="1.6" opacity=".7"/><circle cx="66" cy="10" r="1.6" opacity=".7"/>
      <circle cx="-48" cy="60" r="1.3" opacity=".55"/><circle cx="48" cy="60" r="1.3" opacity=".55"/>
    </g>
  </g>

  <text x="150" y="70" text-anchor="middle" font-size="27" letter-spacing="7" fill="url(#bk-gold)" font-weight="bold">WARGRACE</text>
  <path d="M60 86 H240" stroke="#c9a227" stroke-width="1" opacity=".5"/>
  <path d="M96 86 l6 -4 6 4 -6 4 Z" fill="#d4af37" transform="translate(48 0)"/>

  <text x="150" y="342" text-anchor="middle" font-size="11" letter-spacing="5" fill="#8a9ac0" opacity=".9">SPELL &#183; GUARD &#183; STRIKE</text>
  <path d="M84 356 H216" stroke="#c9a227" stroke-width="1" opacity=".4"/>
  <text x="150" y="382" text-anchor="middle" font-size="12" letter-spacing="3" fill="#c9b87a" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">ウォーグレイス</text>
</svg>
