<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif">
  <defs>
    <linearGradient id="ag-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e4a8"/><stop offset=".45" stop-color="#d4af37"/><stop offset="1" stop-color="#7a5f1e"/>
    </linearGradient>
    <linearGradient id="ag-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a5a30"/><stop offset=".5" stop-color="#c9a860"/><stop offset="1" stop-color="#4a3a1c"/>
    </linearGradient>
    <linearGradient id="ag-parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece2c6"/><stop offset="1" stop-color="#cbbc94"/>
    </linearGradient>
    <radialGradient id="ag-art" cx=".5" cy=".4" r=".9">
      <stop offset="0" stop-color="#3a1a28"/><stop offset=".55" stop-color="#1e0c16"/><stop offset="1" stop-color="#080308"/>
    </radialGradient>
    <linearGradient id="ag-fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5a6a"/><stop offset=".6" stop-color="#4a3040"/><stop offset="1" stop-color="#241018"/>
    </linearGradient>
    <linearGradient id="ag-arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b0c8"/><stop offset="1" stop-color="#8a3a5a"/>
    </linearGradient>
    <filter id="ag-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" result="n" seed="13"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .55 0 0 0 0 .38 0 0 0 0 .46 0 0 0 .14 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="ag-crumble" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".03 .06" numOctaves="3" seed="3" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="24"/>
    </filter>
    <clipPath id="ag-clip"><rect x="24" y="70" width="252" height="188" rx="6"/></clipPath>
  </defs>

  <rect x="3" y="3" width="294" height="414" rx="14" fill="#0a0810"/>
  <rect x="3" y="3" width="294" height="414" rx="14" filter="url(#ag-noise)"/>
  <rect x="7.5" y="7.5" width="285" height="405" rx="11" fill="none" stroke="url(#ag-frame)" stroke-width="3"/>
  <rect x="13" y="13" width="274" height="394" rx="8" fill="none" stroke="#c9a227" stroke-opacity=".4"/>
  <g stroke="url(#ag-gold)" stroke-width="2" fill="none">
    <path d="M13 34 Q13 13 34 13"/><path d="M266 13 Q287 13 287 34"/>
    <path d="M287 386 Q287 407 266 407"/><path d="M34 407 Q13 407 13 386"/>
  </g>
  <g fill="#d4af37"><circle cx="21" cy="21" r="2.2"/><circle cx="279" cy="21" r="2.2"/><circle cx="279" cy="399" r="2.2"/><circle cx="21" cy="399" r="2.2"/></g>

  <circle cx="38" cy="40" r="17" fill="#1e0c16" stroke="url(#ag-gold)" stroke-width="2.5"/>
  <path d="M38 30 V48 M32 42 L38 50 L44 42" stroke="#d88aae" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="163" y="40" text-anchor="middle" font-size="25" fill="#efe6cf" font-family="Georgia,'Times New Roman',serif" letter-spacing="2">aging</text>
  <text x="163" y="59" text-anchor="middle" font-size="13" letter-spacing="6" fill="#c9b87a">老化</text>

  <rect x="24" y="70" width="252" height="188" rx="6" fill="url(#ag-art)"/>
  <g clip-path="url(#ag-clip)">
    <ellipse cx="150" cy="150" rx="115" ry="90" fill="#5a2a42" opacity=".3"/>
    <g filter="url(#ag-crumble)">
      <path d="M150 94 C122 112 116 160 122 240 L178 240 C184 160 178 112 150 94 Z" fill="url(#ag-fig)"/>
      <path d="M150 94 C138 102 130 118 128 140 L172 140 C170 118 162 102 150 94 Z" fill="#5a4050"/>
      <rect x="140" y="114" width="20" height="8" rx="4" fill="#160812"/>
    </g>
    <circle cx="145" cy="118" r="1.8" fill="#d88aae" opacity=".9"/><circle cx="155" cy="118" r="1.8" fill="#d88aae" opacity=".9"/>
    <g fill="#4a3040" opacity=".9">
      <rect x="176" y="130" width="7" height="7" transform="rotate(18 180 134)"/>
      <rect x="188" y="152" width="6" height="6" transform="rotate(-14 191 155)"/>
      <rect x="182" y="178" width="8" height="8" transform="rotate(28 186 182)"/>
      <rect x="196" y="120" width="5" height="5" transform="rotate(40 198 122)"/>
      <rect x="204" y="188" width="5" height="5" transform="rotate(-30 206 190)"/>
      <rect x="192" y="210" width="6" height="6" transform="rotate(12 195 213)"/>
    </g>
    <g stroke="url(#ag-arrow)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
      <path d="M228 118 V196 M214 180 L228 198 L242 180"/>
    </g>
    <g stroke="#8a5a6e" stroke-width="1.6" fill="none" opacity=".65" stroke-linecap="round">
      <path d="M70 120 q14 8 12 26 q-2 16 8 24"/>
      <path d="M58 160 q10 10 6 28"/>
      <path d="M84 96 q10 12 4 26"/>
    </g>
    <g fill="#d8a8c0">
      <circle cx="94" cy="200" r="1.5" opacity=".6"/><circle cx="76" cy="226" r="1.3" opacity=".5"/>
      <circle cx="216" cy="230" r="1.4" opacity=".5"/><circle cx="110" cy="152" r="1.2" opacity=".55"/>
    </g>
    <ellipse cx="150" cy="252" rx="125" ry="16" fill="#040106" opacity=".92"/>
    <g fill="#3a2430" filter="url(#ag-crumble)">
      <ellipse cx="150" cy="244" rx="46" ry="6"/>
    </g>
  </g>
  <rect x="24" y="70" width="252" height="188" rx="6" fill="none" stroke="url(#ag-frame)" stroke-width="1.5"/>

  <rect x="26" y="286" width="248" height="92" rx="5" fill="url(#ag-parch)" stroke="#4a3a20" stroke-width="1.5"/>
  <rect x="29" y="289" width="242" height="86" rx="3" fill="none" stroke="#8a744a" stroke-opacity=".5"/>
  <text x="150" y="305" text-anchor="middle" font-size="10" letter-spacing="3" fill="#7a6640">─ スペルカード ─</text>
  <text x="150" y="325" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#241c10">戦場のストライカー1人の</text>
  <text x="150" y="344" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#241c10">エネルギーを1下げる</text>
  <text x="150" y="366" text-anchor="middle" font-size="10.5" fill="#6a5c40">「時は誰にも等しく流れる」</text>

  <circle cx="150" cy="394" r="13" fill="#1e0c16" stroke="url(#ag-gold)" stroke-width="2"/>
  <path d="M150 388 V398 M145.5 394 L150 399.5 L154.5 394" stroke="#d88aae" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
